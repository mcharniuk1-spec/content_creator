<rect x="70" y="620" width="940" height="480" rx="32" fill="#1A1D1A" stroke="#C8FF32" stroke-width="5"/>
<foreignObject x="115" y="680" width="850" height="360"><div xmlns="http://www.w3.org/1999/xhtml" style="font:500 42px/1.2 Helvetica,Arial;color:#F3EEDC">Creator speaking directly to camera. Chest-up 9:16, eye line at upper third, practical operator tone, natural hand movement, clean depth separation.</div></foreignObject>
<text x="70" y="1190" fill="#C8FF32" font-family="Helvetica,Arial" font-size="25" font-weight="700">NARRATION</text>
<foreignObject x="70" y="1230" width="940" height="250"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 37px/1.25 Helvetica,Arial;color:#F3EEDC">Separate quality evidence from release authority.</div></foreignObject>
