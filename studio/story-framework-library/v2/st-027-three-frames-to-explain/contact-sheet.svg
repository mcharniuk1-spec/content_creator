<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 2300" width="1920" height="2300"><rect width="1920" height="2300" fill="#F4F0E7"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#111927">ST-027 · Three Frames to Explain</text><text x="60" y="118" font-family="Arial,sans-serif" font-size="22" fill="#455064">countdown_ladder · 6 seconds · read left to right · LOCAL PREVIS / PROVIDER NOT RUN</text><image href="frames/ST-027-F01.svg" x="60" y="240" width="540" height="960"/><text x="60" y="1230" font-family="Arial,sans-serif" font-size="22" fill="#1b2430">ST-027-F01 · 0–1s · hook</text><image href="frames/ST-027-F02.svg" x="680" y="240" width="540" height="960"/><text x="680" y="1230" font-family="Arial,sans-serif" font-size="22" fill="#1b2430">ST-027-F02 · 1–2s · orientation</text><image href="frames/ST-027-F03.svg" x="1300" y="240" width="540" height="960"/><text x="1300" y="1230" font-family="Arial,sans-serif" font-size="22" fill="#1b2430">ST-027-F03 · 2–3s · attempt</text><image href="frames/ST-027-F04.svg" x="60" y="1250" width="540" height="960"/><text x="60" y="2240" font-family="Arial,sans-serif" font-size="22" fill="#1b2430">ST-027-F04 · 3–4s · mechanism</text><image href="frames/ST-027-F05.svg" x="680" y="1250" width="540" height="960"/><text x="680" y="2240" font-family="Arial,sans-serif" font-size="22" fill="#1b2430">ST-027-F05 · 4–5s · proof</text><image href="frames/ST-027-F06.svg" x="1300" y="1250" width="540" height="960"/><text x="1300" y="2240" font-family="Arial,sans-serif" font-size="22" fill="#1b2430">ST-027-F06 · 5–6s · handback</text><text x="60" y="2250" font-family="Arial,sans-serif" font-size="20" fill="#455064">Frame sequence: hook → orientation → resistance/action → proof → bounded payoff/handback.</text></svg>