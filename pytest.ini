[pytest]
# `python3 -m pytest -q` only ever means the pytest-native suite under tests/. The
# root-level test_*.py files (test_baseline.py, test_cards.py, ...) are standalone
# scripts run directly (`python3 test_cards.py`) — see README "Checks" and
# docs/TESTING.md. They are plain modules that call sys.exit() at import time, which
# crashes pytest's collector (INTERNALERROR) if it ever tries to import them; scoping
# testpaths to tests/ keeps the two suites from colliding.
testpaths = tests
markers =
    slow: exercises real subprocess/model work; skip for a quick loop (deselect with -m "not slow")
