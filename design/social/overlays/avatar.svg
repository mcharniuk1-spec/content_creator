<mask id="ringmask"><rect x="0" y="0" width="1080" height="1080" fill="white"/><circle cx="540" cy="540" r="486" fill="black"/></mask><circle cx="540" cy="540" r="540" fill="rgba(216,64,43,0.35)" mask="url(#ringmask)"/><mask id="cornermask"><rect x="0" y="0" width="1080" height="1080" fill="white"/><circle cx="540" cy="540" r="540" fill="black"/></mask><rect x="0" y="0" width="1080" height="1080" fill="rgba(216,64,43,0.35)" mask="url(#cornermask)"/><circle cx="540" cy="540" r="486" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="10,8"/><circle cx="540" cy="540" r="540" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="16,10"/><text x="540" y="530" font-family="monospace" font-size="28" fill="#111" text-anchor="middle">A</text><text x="540" y="570" font-family="monospace" font-size="28" fill="#111" text-anchor="middle">r=486</text><text x="540" y="40" font-family="monospace" font-size="28" fill="#111" text-anchor="middle">GRID crop circle r=540</text><text x="540" y="1060" font-family="monospace" font-size="28" fill="#111" text-anchor="middle">mark 55-60% of diameter</text>
