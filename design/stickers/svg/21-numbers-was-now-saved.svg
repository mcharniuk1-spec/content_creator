  <rect x="496" y="0" width="240" height="4" fill="#0C1D1D"/>
  <text x="496" y="54" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="28" font-weight="500" fill="#5C6565" letter-spacing="4.48" xml:space="preserve">SAVED</text>
  <text id="slot-saved" x="496" y="168" font-family="Saira SemiCondensed, IBM Plex Sans Condensed, Arial Narrow, sans-serif" font-size="88" font-weight="900" fill="#0C1D1D" letter-spacing="-0.88" xml:space="preserve">145</text>
  <rect x="496" y="184" width="127.7" height="12" fill="#0C1D1D"/>
