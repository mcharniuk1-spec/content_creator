  <rect x="1" y="1" width="798" height="302" fill="none" stroke="#0C1D1D" stroke-width="2"/>
  <text id="slot-label-a" x="32" y="60" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="28" font-weight="500" fill="#5C6565" letter-spacing="4.48" xml:space="preserve">WAS</text>
  <rect x="32" y="76" width="480" height="44" fill="#5C6565"/>
  <text id="slot-value-a" x="528" y="109.17" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="32" font-weight="500" fill="#0C1D1D" letter-spacing="2.56" xml:space="preserve">240 MIN</text>
  <text id="slot-label-b" x="32" y="176" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="28" font-weight="500" fill="#5C6565" letter-spacing="4.48" xml:space="preserve">NOW</text>
