<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1800" viewBox="0 0 1080 1800"><rect width="1080" height="1800" fill="#101210"/><text x="40" y="70" fill="#C8FF32" font-family="Helvetica" font-size="28" font-weight="700">CONTACT INDEX — INDIVIDUAL SVG FRAMES ARE CANONICAL</text><foreignObject x="40" y="95" width="1000" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 38px Helvetica;color:#F3EEDC">RAG Is Not Memory—and Neither Is Chat History</div></foreignObject><rect x="40" y="170" width="460" height="250" rx="20" fill="#1A1D1A" stroke="#C8FF32" stroke-width="4"/><text x="64" y="212" fill="#C8FF32" font-family="Helvetica" font-size="20" font-weight="700">01 · CREATOR AROLL</text><foreignObject x="64" y="238" width="412" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 24px/1.2 Helvetica;color:#F3EEDC">RAG is not memory. And chat history is not an operating record.</div></foreignObject><rect x="540" y="170" width="460" height="250" rx="20" fill="#1A1D1A" stroke="#FFB000" stroke-width="4"/><text x="564" y="212" fill="#FFB000" font-family="Helvetica" font-size="20" font-weight="700">02 · DETERMINISTIC OVERLAY</text><foreignObject x="564" y="238" width="412" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 24px/1.2 Helvetica;color:#F3EEDC">Retrieval finds source material. Working state tracks the current job.</div></foreignObject><rect x="40" y="470" width="460" height="250" rx="20" fill="#1A1D1A" stroke="#C8FF32" stroke-width="4"/><text x="64" y="512" fill="#C8FF32" font-family="Helvetica" font-size="20" font-weight="700">03 · CREATOR AROLL</text><foreignObject x="64" y="538" width="412" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 24px/1.2 Helvetica;color:#F3EEDC">Durable memory preserves reviewed decisions. Audit evidence proves what happened.</div></foreignObject><rect x="540" y="470" width="460" height="250" rx="20" fill="#1A1D1A" stroke="#73E2C6" stroke-width="4"/><text x="564" y="512" fill="#73E2C6" font-family="Helvetica" font-size="20" font-weight="700">04 · SCREEN DEMO</text><foreignObject x="564" y="538" width="412" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 24px/1.2 Helvetica;color:#F3EEDC">Four-layer knowledge architecture: SOURCE / WORKING STATE / REVIEWED MEMORY / AUDIT RECEIPT.</div></foreignObject><rect x="40" y="770" width="460" height="250" rx="20" fill="#1A1D1A" stroke="#C8FF32" stroke-width="4"/><text x="64" y="812" fill="#C8FF32" font-family="Helvetica" font-size="20" font-weight="700">05 · CREATOR AROLL</text><foreignObject x="64" y="838" width="412" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 24px/1.2 Helvetica;color:#F3EEDC">Mix these layers and stale context becomes invisible authority.</div></foreignObject><rect x="540" y="770" width="460" height="250" rx="20" fill="#1A1D1A" stroke="#FFB000" stroke-width="4"/><text x="564" y="812" fill="#FFB000" font-family="Helvetica" font-size="20" font-weight="700">06 · DETERMINISTIC OVERLAY</text><foreignObject x="564" y="838" width="412" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 24px/1.2 Helvetica;color:#F3EEDC">Separate source, state, decision, and receipt—with retention rules for each.</div></foreignObject><rect x="40" y="1070" width="460" height="250" rx="20" fill="#1A1D1A" stroke="#B9A7FF" stroke-width="4"/><text x="64" y="1112" fill="#B9A7FF" font-family="Helvetica" font-size="20" font-weight="700">07 · AI GENERATED BROLL</text><foreignObject x="64" y="1138" width="412" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 24px/1.2 Helvetica;color:#F3EEDC">Optional two-second metaphorical context insert. It must not carry evidence, results, UI, nu</div></foreignObject><rect x="540" y="1070" width="460" height="250" rx="20" fill="#1A1D1A" stroke="#C8FF32" stroke-width="4"/><text x="564" y="1112" fill="#C8FF32" font-family="Helvetica" font-size="20" font-weight="700">08 · CREATOR AROLL</text><foreignObject x="564" y="1138" width="412" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 24px/1.2 Helvetica;color:#F3EEDC">Your agent becomes easier to debug because every fact has a home.</div></foreignObject><rect x="40" y="1370" width="460" height="250" rx="20" fill="#1A1D1A" stroke="#FFB000" stroke-width="4"/><text x="64" y="1412" fill="#FFB000" font-family="Helvetica" font-size="20" font-weight="700">09 · DETERMINISTIC OVERLAY</text><foreignObject x="64" y="1438" width="412" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 24px/1.2 Helvetica;color:#F3EEDC">Kinetic type supports: Map these four layers in your stack.</div></foreignObject><rect x="540" y="1370" width="460" height="250" rx="20" fill="#1A1D1A" stroke="#F3EEDC" stroke-width="4"/><text x="564" y="1412" fill="#F3EEDC" font-family="Helvetica" font-size="20" font-weight="700">10 · END CARD</text><foreignObject x="564" y="1438" width="412" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 24px/1.2 Helvetica;color:#F3EEDC">North Hux end card: Map these four layers in your stack.</div></foreignObject></svg>